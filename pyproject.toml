[project]
name = "taxi-demand-mlops"
version = "0.1.0"
description = "Reproducible MLOps system for NYC taxi demand forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.0,<4",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.59,<4",
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.9",
]
